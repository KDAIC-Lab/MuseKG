<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseKG | Museum Explorer</title>
    <script src="/vendor/cytoscape.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-color: #161b22;
            --accent-color: #58a6ff;
            --text-color: #c9d1d9;
            --card-bg: #21262d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        #sidebar {
            width: 400px;
            background-color: var(--sidebar-color);
            display: flex;
            flex-direction: column;
            border-right: 1px solid #30363d;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
            background: linear-gradient(45deg, #1f6feb, #238636);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-color);
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            border-left-color: #238636;
            align-self: flex-end;
            background-color: #1c2e23;
        }

        .message .meta {
            font-size: 0.75rem;
            color: #8b949e;
            margin-bottom: 5px;
            display: block;
        }

        .message-text {
            white-space: pre-wrap;
        }

        #input-area {
            padding: 20px;
            border-top: 1px solid #30363d;
            background-color: var(--sidebar-color);
        }

        #query-input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-family: inherit;
            resize: none;
            outline: none;
        }

        #query-input:focus {
            border-color: var(--accent-color);
        }

        #main-view {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1c2128 0%, #0d1117 100%);
        }

        #cy {
            width: 100%;
            height: 100%;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--accent-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .loader.active {
            opacity: 1;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* Info Panel */
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            max-height: calc(100% - 40px);
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            z-index: 100;
            overflow-y: auto;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        #info-panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        #info-panel h3 {
            margin: 0 0 15px 0;
            color: #d2a8ff;
            font-size: 1.1rem;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        #info-panel .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        #info-panel .close-btn:hover {
            color: #fff;
        }

        #info-panel .attr-row {
            display: flex;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        #info-panel .attr-key {
            color: #58a6ff;
            min-width: 120px;
            font-weight: 500;
        }

        #info-panel .attr-value {
            color: #c9d1d9;
            flex: 1;
            word-break: break-word;
        }

        #info-panel .no-attrs {
            color: #8b949e;
            font-style: italic;
        }

        #info-panel .object-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #30363d;
        }

        #info-panel .no-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #1c2128 0%, #30363d 100%);
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            font-size: 2rem;
        }

        .suggestion-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .chip {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            background-color: #30363d;
            border-color: #58a6ff;
            color: #fff;
        }
        #service-status { color: #8b949e; font-size: 0.8rem; }
        #query-input:disabled { opacity: 0.6; }
        @media (max-width: 760px) {
            body { flex-direction: column; }
            #sidebar { width: 100%; height: 48vh; flex-shrink: 0; }
            #main-view { min-height: 0; }
            #info-panel { max-width: calc(100% - 50px); max-height: 80%; overflow-y: auto; }
        }
    </style>
</head>

<body>

    <div id="sidebar">
        <div id="header">
            <span>🏛️ MuseKG Demo</span>
            <div id="loader" class="loader"></div>
        </div>
        <div id="chat-container">
            <div class="message">
                <span class="meta">System</span>
                Welcome to MuseKG! Explore the collection by asking questions or selecting an
                example below:
                <div class="suggestion-chips" id="suggestions"></div>
                <p id="service-status" role="status">Connecting to the collection…</p>
            </div>
        </div>
        <div id="input-area">
            <textarea id="query-input" aria-label="Ask about the collection" maxlength="500" rows="2" placeholder="Ask a question..." onkeydown="handleKey(event)"></textarea>
        </div>
    </div>

    <div id="main-view">
        <div id="cy"></div>
        <div id="info-panel">
            <button class="close-btn" onclick="closeInfoPanel()">&times;</button>
            <h3 id="info-title">Node Properties</h3>
            <div id="info-content"></div>
        </div>
    </div>

    <script>
        function setInput(text) {
            const input = document.getElementById('query-input');
            input.value = text;
            input.focus();
            // Optional: Auto-submit?
            // handleKey({ key: 'Enter', preventDefault: () => {} });
        }

        let cy = cytoscape({
            container: document.getElementById('cy'),
            minZoom: 0.2,
            maxZoom: 1.4,
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': '#58a6ff',
                        'label': 'data(label)',
                        'color': '#fff',
                        'font-size': '12px',
                        'text-valign': 'bottom',
                        'text-margin-y': 8,
                        'text-wrap': 'wrap',
                        'text-max-width': 140,
                        'text-halign': 'center',
                        'width': 40,
                        'height': 40,
                        'text-outline-width': 2,
                        'text-outline-color': '#0d1117'
                    }
                },
                {
                    selector: 'node[type="object"]',
                    style: { 'background-color': '#d2a8ff', 'shape': 'rectangle' }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 2,
                        'line-color': '#30363d',
                        'target-arrow-color': '#30363d',
                        'target-arrow-shape': 'triangle',
                        'curve-style': 'bezier',
                        'label': 'data(label)',
                        'font-size': '10px',
                        'color': '#8b949e',
                        'text-rotation': 'autorotate'
                    }
                }
            ]
        });

        let queryPending = false;

        async function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const input = document.getElementById('query-input');
                const query = input.value.trim();
                if (!query || queryPending) return;
                queryPending = true;
                input.disabled = true;

                // Add user message
                addMessage('User', query, 'user');
                input.value = '';
                document.getElementById('loader').classList.add('active');

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000);

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ query }),
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        throw new Error(`Server returned HTTP ${response.status}`);
                    }

                    const data = await response.json();

                    if (!data.answer || !data.graph_data) {
                        throw new Error('Server returned an incomplete response');
                    }

                    // Add system response
                    addMessage(data.answer_mode === 'llm' ? 'MuseKG · Model answer' : 'MuseKG · Graph answer', data.answer);

                    // Update Graph
                    updateGraph(data.graph_data);

                } catch (err) {
                    const message = err.name === 'AbortError'
                        ? 'The query timed out. Please try one of the suggested examples.'
                        : 'Unable to complete the query. Please check the server connection.';
                    addMessage('System', message);
                    console.error(err);
                } finally {
                    clearTimeout(timeoutId);
                    document.getElementById('loader').classList.remove('active');
                    queryPending = false;
                    input.disabled = false;
                    input.focus();
                }
            }
        }

        function addMessage(sender, text, type = '') {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = sender;
            const messageText = document.createElement('div');
            messageText.className = 'message-text';
            messageText.textContent = text;
            div.append(meta, messageText);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Store current node attributes for info panel
        let currentNodeAttrs = Object.create(null);

        function updateGraph(data) {
            cy.elements().remove();
            currentNodeAttrs = Object.create(null); // Reset
            if (data.nodes && data.nodes.length > 0) {
                // Store attributes for each node
                data.nodes.forEach(n => {
                    currentNodeAttrs[n.id] = n;
                });
                cy.add(data.nodes.map(n => ({ group: 'nodes', data: n })));
                cy.add(data.edges.map(e => ({ group: 'edges', data: e })));
                cy.layout({
                    name: 'concentric', animate: false, padding: 48,
                    minNodeSpacing: 80, nodeDimensionsIncludeLabels: true,
                    concentric: node => node.degree(), levelWidth: () => 1
                }).run();
            }
            closeInfoPanel();
        }

        // Handle node click to show info panel
        cy.on('tap', 'node', function (evt) {
            const node = evt.target;
            const nodeData = currentNodeAttrs[node.id()] || node.data();
            showInfoPanel(nodeData);
        });

        // Click on background closes panel
        cy.on('tap', function (evt) {
            if (evt.target === cy) {
                closeInfoPanel();
            }
        });

        function showInfoPanel(nodeData) {
            const panel = document.getElementById('info-panel');
            const title = document.getElementById('info-title');
            const content = document.getElementById('info-content');

            title.textContent = nodeData.label || nodeData.id || 'Node Properties';

            // Attribute key mapping for display
            const keyLabels = {
                'type': 'Type',
                'material': 'Material',
                'creation_date': 'Creation Date',
                'dimensions': 'Dimensions',
                'accession_number': 'Accession No.',
                'description': 'Description',
                'collection': 'Collection',
                'category': 'Category',
                'museum': 'Museum',
                'credit_line': 'Credit Line'
            };

            // Treat all graph fields as text, including titles and attribute names.
            content.replaceChildren();
            const skipKeys = new Set([
                'id', 'label', 'title', 'source_id', 'image_url',
                'material_desc', 'production_date', 'measurements', 'accession_no', 'history_cat'
            ]);
            if (typeof nodeData.image_url === 'string' &&
                /^\/images\/[A-Za-z0-9_-]+\.(jpg|jpeg|png|webp)$/i.test(nodeData.image_url)) {
                const img = document.createElement('img');
                img.className = 'object-image';
                img.src = nodeData.image_url;
                img.alt = nodeData.label || 'Museum object';
                img.addEventListener('error', () => img.remove());
                content.appendChild(img);
            } else if (nodeData.type === 'object') {
                const placeholder = document.createElement('div');
                placeholder.className = 'no-image';
                placeholder.textContent = '🖼️';
                content.appendChild(placeholder);
            }
            for (const [key, value] of Object.entries(nodeData)) {
                if (skipKeys.has(key) || value === null || value === undefined || value === '') continue;
                const row = document.createElement('div');
                row.className = 'attr-row';
                const label = document.createElement('span');
                label.className = 'attr-key';
                label.textContent = (keyLabels[key] || key.replace(/_/g, ' ')) + ':';
                const text = document.createElement('span');
                text.className = 'attr-value';
                text.textContent = typeof value === 'object' ? JSON.stringify(value) : String(value);
                row.append(label, text);
                content.appendChild(row);
            }
            if (!content.childElementCount) {
                const empty = document.createElement('p');
                empty.className = 'no-attrs';
                empty.textContent = 'No additional attributes available.';
                content.appendChild(empty);
            }

            panel.classList.add('active');
        }

        async function loadCollection() {
            const status = document.getElementById('service-status');
            try {
                const [healthResponse, examplesResponse] = await Promise.all([
                    fetch('/health'), fetch('/api/examples')
                ]);
                if (!healthResponse.ok || !examplesResponse.ok) throw new Error('Unavailable');
                const health = await healthResponse.json();
                const examples = await examplesResponse.json();
                status.textContent = !health.ready ? 'The collection is not loaded yet.' :
                    health.llm_enabled ? 'Collection ready · Model answers enabled' :
                    'Collection ready · Graph answers enabled';
                for (const question of examples) {
                    const button = document.createElement('button');
                    button.className = 'chip';
                    button.textContent = question;
                    button.addEventListener('click', () => setInput(question));
                    document.getElementById('suggestions').appendChild(button);
                }
            } catch (_) {
                status.textContent = 'Unable to connect to the collection.';
            }
        }
        loadCollection();

        function closeInfoPanel() {
            document.getElementById('info-panel').classList.remove('active');
        }
    </script>

</body>

</html>
